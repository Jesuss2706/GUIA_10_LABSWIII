<label [for]="id" class="form-label">{{ label }}</label>
<div class="control">
  <select
    [id]="id"
    [required]="required"
    [(ngModel) ]="value"
    (ngModelChange)="onModelChange($event)"
    (blur)="onTouched()"
    class="form-select"
  >
    <option *ngFor="let option of options" [value]="option.value">
      {{ option.label }}
    </option>
  </select>
</div>
