<form class="form-horizontal" (submit)="onSubmit($event)">
  <molecule-form-field>
    <atom-select
      label="Producto"
      id="sol-prod"
      name="producto"
      placeholder="Seleccione un producto"
      [options]="productosOptions"
      [required]="true"
      [(ngModel)]="solicitud.producto"
    ></atom-select>
  </molecule-form-field>

  <molecule-form-field>
    <atom-input-text
      label="Cantidad"
      id="sol-cant"
      name="cantidad"
      type="number"
      placeholder="Digite la cantidad"
      [required]="true"
      [(ngModel)]="solicitud.cantidad"
    ></atom-input-text>
  </molecule-form-field>

  <molecule-form-field>
    <atom-input-text
      label="Fecha"
      id="sol-fecha"
      name="fecha"
      type="date"
      placeholder="dd/mm/aaaa"
      [required]="true"
      [(ngModel)]="solicitud.fecha"
    ></atom-input-text>
  </molecule-form-field>

  <atom-button label="Registrar solicitud" type="submit" color="success"></atom-button>
</form>
